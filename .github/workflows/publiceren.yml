# Zet de website automatisch online via GitHub Pages.
# Dit draait vanzelf bij elke wijziging die je op GitHub opslaat.
name: Website publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:   # ook handmatig te starten via het tabblad "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bouw/requirements.txt
      - run: pip install -r bouw/requirements.txt
      - run: python bouw/bouw.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
