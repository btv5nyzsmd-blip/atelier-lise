# =====================================================================
#  ALLE TEKSTEN EN PRIJZEN VAN DE WEBSITE
# =====================================================================
#
#  Dit is het enige bestand dat je hoeft aan te passen om teksten of
#  prijzen te veranderen. Een paar spelregels:
#
#  1. Tekst staat tussen "aanhalingstekens". Laat die staan.
#     Wil je binnen een tekst een aanhalingsteken? Gebruik dan ’ of ‘ ’
#     (bijvoorbeeld: ’s avonds).
#  2. De inspringing (spaties aan het begin van een regel) is belangrijk.
#     Gebruik spaties, geen tab. Kopieer bij twijfel een bestaande regel.
#  3. Een regel die begint met # is een notitie en komt niet op de site.
#  4. Een nieuwe behandeling of vraag toevoegen? Kopieer een blok dat
#     begint met een streepje (-) en pas de tekst aan.
#
# =====================================================================


