# ---------------------------------------------------------------------
#  OVER MIJ
# ---------------------------------------------------------------------
#  De foto van Lise heet  fotos/lise.jpg  .
over_mij:
  kop: "Hoi, ik ben Lise"
  alineas:
    - "Al sinds mijn tienerjaren lakte ik de nagels van vriendinnen, zussen en iedereen die even stil wilde zitten. Wat begon als hobby, werd een vak: ik volgde de opleiding tot nagelstyliste en werk inmiddels een aantal jaar met gellak, BIAB en gel."
    - "In mijn studio aan huis in Zwolle neem ik voor iedere klant ruim de tijd. Geen lopende band, maar rustig samen kijken wat bij jouw handen en jouw stijl past."
    - "Het mooiste vind ik het moment dat iemand haar handen bekijkt en zegt: “Wauw, zijn dit de mijne?”"
  werkwijze_kop: "Zo werk ik"
  werkwijze:
    - "We beginnen met een kort gesprek: wat wil je, en hoe zijn je nagels nu?"
    - "Ik verzorg je nagelriemen en breng je nagels in vorm."
    - "Daarna gellak of gel, laag voor laag uitgehard onder de lamp."
    - "Je gaat naar huis met nazorgtips, zodat je er zo lang mogelijk van geniet."
  hygiene_kop: "Hygiëne"
  hygiene:
    - "Metalen instrumenten worden na iedere klant gereinigd en gedesinfecteerd."
    - "Vijlen en buffers zijn voor eenmalig gebruik, of gaan na afloop mee naar huis."
    - "Werkplek en handen worden voor elke behandeling schoongemaakt."
    - "Ik werk met professionele producten van gerenommeerde merken."


# ---------------------------------------------------------------------
#  VEELGESTELDE VRAGEN
# ---------------------------------------------------------------------
vragen:
  - vraag: "Hoe lang blijft gellak zitten?"
    antwoord: "Gemiddeld 2 tot 3 weken. Dat hangt af van je eigen nagels en wat je met je handen doet. Na 3 weken is je nagel zichtbaar uitgegroeid en is het tijd voor een nieuwe set."
  - vraag: "Kan ik gellak zelf verwijderen?"
    antwoord: "Liever niet trekken of pulken: dan gaat er een laagje van je eigen nagel mee en worden je nagels dun. Ik verwijder je oude gellak gratis bij een nieuwe behandeling. Wil je het zelf doen, vraag me dan om tips."
  - vraag: "Hoe zorg ik dat het lang mooi blijft?"
    antwoord: "Gebruik dagelijks een druppel nagelriemolie, draag handschoenen bij schoonmaken en afwassen, en gebruik je nagels niet als gereedschap (blikjes, stickers…). Heb je binnen 5 dagen toch een nagel die loslaat? Dan herstel ik hem gratis."
  - vraag: "Is gellak slecht voor mijn nagels?"
    antwoord: "Niet als het goed wordt aangebracht en verwijderd. De meeste schade ontstaat door trekken of hard vijlen. Daarom werk ik voorzichtig en raad ik af om je gellak er zelf af te halen."
  - vraag: "Wat is het verschil tussen gellak en BIAB?"
    antwoord: "Gellak is een kleurlaag op je natuurlijke nagel. BIAB is wat dikker en steviger, en helpt als je nagels snel breken of zacht zijn. Je kunt er ook een kleur op laten zetten."
  - vraag: "Wat als ik mijn afspraak moet verzetten?"
    antwoord: "Laat het uiterlijk 24 uur van tevoren weten via Instagram, dan zoeken we samen een nieuwe datum. Er kan altijd iets tussenkomen, dus neem gerust contact op."
  - vraag: "Hoe kan ik betalen?"
    antwoord: "Contant of via een Tikkie na afloop."
  - vraag: "Kan ik parkeren?"
    antwoord: "Ja, in de straat kun je parkeren. Op de fiets? Dan staat hij veilig in de voortuin."


